name: CI – Momentic Smoke Test

on:
  pull_request:
  push:
    branches: ["main", "momentic-demo"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      MOMENTIC_API_KEY: ${{ secrets.MOMENTIC_API_KEY }}

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3️⃣ Install dependencies
      - name: Install NPM dependencies
        run: npm install

      # 4️⃣ Verify files exist
      - name: Verify test files
        run: |
          echo "Root folder contents:"
          ls -la
          echo "Tests folder contents:"
          ls -la tests
          echo "Momentic config:"
          cat momentic.config.yaml

      # 5️⃣ Install Momentic browsers
      - name: Install Momentic browsers
        run: npx momentic install-browsers --all

      # 6️⃣ Run Momentic smoke test
      - name: Run Momentic test
        run: npx momentic run tests/cli-test-run.test.yaml --api-key $MOMENTIC_API_KEY
